server:
  port: 8080
spring:
  application:
    name: cinema-booking
  datasource:
    master:
      jdbc-url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/cinema?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
      username: ${DB_USER:root}
      password: ${DB_PASS:cinema123}
      driver-class-name: com.mysql.cj.jdbc.Driver
    slave:
      jdbc-url: jdbc:mysql://${SLAVE_DB_HOST:localhost}:${SLAVE_DB_PORT:3307}/cinema?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
      username: ${SLAVE_DB_USER:root}
      password: ${SLAVE_DB_PASS:cinema123}
      driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
    sentinel:
      eager: true
      transport:
        port: 8719
        dashboard: localhost:8858
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
cinema:
  jwt:
    secret: ${JWT_SECRET:cinemaBookingSecretKey2024SuperSecure256Bit!}
    expiration-ms: 86400000
  seat-lock-ttl-seconds: 600
  zookeeper:
    enabled: ${ZOOKEEPER_ENABLED:true}
    connect-string: ${ZOOKEEPER_HOST:localhost}:${ZOOKEEPER_PORT:2181}
    base-path: /cinema/instances
logging:
  file:
    path: /home/cinema/cinema-booking/logs
  level:
    com.cinema: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
logstash:
  host: ${LOGSTASH_HOST:localhost}
  port: ${LOGSTASH_PORT:5044}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
