global:
  scrape_interval: 15s

scrape_configs:
  - job_name: cinema-backend-1
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend-1:8080']

  - job_name: cinema-backend-2
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend-2:8080']
