services:
  mysql:
    image: mysql:8.0
    container_name: cinema-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ***
      MYSQL_DATABASE: cinema
      MYSQL_USER: cinema
      MYSQL_PASSWORD: ***
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cinema-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cinema-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: zookeeper:3.9
    container_name: cinema-zookeeper
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== 板块8: Nacos 注册中心 =====
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: cinema-nacos
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8848/nacos/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend-1:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cinema-backend-1
    environment:
      DB_HOST: mysql
      DB_USER: cinema
      DB_PASS: cinema123
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      ZOOKEEPER_HOST: zookeeper
      NACOS_HOST: nacos
      NACOS_PORT: 8848
      SPRING_APPLICATION_NAME: cinema-backend-1
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5044
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
      nacos:
        condition: service_healthy
      logstash:
        condition: service_started

  backend-2:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cinema-backend-2
    environment:
      DB_HOST: mysql
      DB_USER: cinema
      DB_PASS: cinema123
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      ZOOKEEPER_HOST: zookeeper
      NACOS_HOST: nacos
      NACOS_PORT: 8848
      SPRING_APPLICATION_NAME: cinema-backend-2
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5044
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
      nacos:
        condition: service_healthy
      logstash:
        condition: service_started

  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    container_name: cinema-nginx
    ports:
      - "80:80"
    depends_on:
      - backend-1
      - backend-2

  # ===== 板块7: 可观测性 =====

  elasticsearch:
    image: elasticsearch:7.17.24
    container_name: cinema-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_PASSWORD=***
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 20

  logstash:
    image: logstash:7.17.24
    container_name: cinema-logstash
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_USER=elastic
      - ES_PASS=cinema123
    ports:
      - "5044:5044"
    volumes:
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: kibana:7.17.24
    container_name: cinema-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=***
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cinema-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - backend-1
      - backend-2

volumes:
  mysql_data:
  es_data:
  prometheus_data: