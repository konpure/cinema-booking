input {
  tcp {
    port => 5044
    codec => json_lines
    tags => ["cinema-backend"]
  }
}

filter {
  # ??? @timestamp ????????  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # ??????????????????
  if [level] =~ /^(ERROR|WARN)$/ {
    mutate {
      add_field => { "log_level_category" => "error-warn" }
    }
  } else {
    mutate {
      add_field => { "log_level_category" => "info-debug" }
    }
  }

  # ?????app_name???????????  if ![app_name] {
    mutate {
      add_field => { "app_name" => "cinema-booking" }
    }
  }

  # ?????????
  mutate {
    strip => ["message", "logger_name", "thread_name"]
  }
}

output {
  # ?????Elasticsearch
  elasticsearch {
    hosts => ["${ES_HOST:elasticsearch}:${ES_PORT:9200}"]
    index => "cinema-logs-%{+YYYY.MM.dd}"
    user => "${ES_USER:elastic}"
    password => "${ES_PASS:cinema123}"
    ssl => false
    ecs_compatibility => disabled
  }

  # ?????????????????Logstash ??????????????????
  # stdout { codec => rubydebug }
}
