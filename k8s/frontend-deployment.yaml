apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: cinema
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: cinema-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cinema
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cinema-frontend
  template:
    metadata:
      labels:
        app: cinema-frontend
    spec:
      containers:
      - name: frontend
        image: cinema/frontend:latest
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10