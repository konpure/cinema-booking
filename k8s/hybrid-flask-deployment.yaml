apiVersion: v1
kind: Service
metadata:
  name: hybrid-flask-svc
  namespace: cinema
spec:
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: hybrid-flask
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybrid-flask
  namespace: cinema
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hybrid-flask
  template:
    metadata:
      labels:
        app: hybrid-flask
    spec:
      volumes:
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      containers:
      - name: flask
        image: cinema/hybrid-flask:latest
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_PORT
          value: "5000"
        volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker.sock
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10